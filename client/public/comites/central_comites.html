<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central dos Comitês · Tech Money</title>
<style>
:root{--teal:#20b0a8;--teal-dark:#0d4f3d;--gold:#f59e0b;--bg:#081311;--card:#0f2926;--line:rgba(255,255,255,.12);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 20% -10%, #0e3b34 0%, var(--bg) 55%);color:#e5e7eb;font-family:'Inter',-apple-system,system-ui,'Segoe UI',sans-serif;min-height:100vh;padding:40px 20px 60px}
.wrap{max-width:1100px;margin:0 auto}
/* HEADER */
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:8px}
.brand-logo{background:#fff;border-radius:20px;width:104px;height:104px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:12px}
.brand-logo img{width:100%;height:auto}
.brand h1{font-size:1.9em;font-weight:800;color:#fff;text-align:center;letter-spacing:-.5px}
.brand p{color:#7f9b96;font-size:.95em;text-align:center;max-width:640px;line-height:1.5}
.sep{height:1px;background:linear-gradient(90deg,transparent,rgba(32,176,168,.5),transparent);margin:22px auto;max-width:420px}
/* HUB SELECT */
.hub{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:10px}
.hub-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 26px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.hub-card:hover{transform:translateY(-4px);border-color:var(--teal);box-shadow:0 14px 34px rgba(32,176,168,.15)}
.hub-card .icon{font-size:2.4em;margin-bottom:10px}
.hub-card h2{font-size:1.3em;color:#fff;margin-bottom:6px}
.hub-card .acr{display:inline-block;background:rgba(32,176,168,.15);color:var(--teal);padding:2px 10px;border-radius:20px;font-size:.75em;font-weight:700;letter-spacing:.4px;margin-bottom:10px}
.hub-card p{color:#9db3af;font-size:.92em;line-height:1.55;margin-bottom:14px}
.hub-card .members-row{display:flex;gap:-8px}
.hub-card .members-row img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--card);margin-left:-8px}
.hub-card .count{position:absolute;top:18px;right:18px;background:var(--teal-dark);color:#bfece7;font-weight:700;font-size:.8em;padding:5px 11px;border-radius:16px}
.enter{background:var(--teal);color:#04211c;border:none;border-radius:10px;padding:10px 20px;font-weight:800;font-size:.9em;cursor:pointer;transition:.15s}
.enter:hover{background:#2fd3ca}
.back{display:none;background:transparent;border:1px solid var(--line);color:#9db3af;border-radius:10px;padding:9px 18px;font-weight:600;cursor:pointer;margin-bottom:20px;font-size:.9em}
.back:hover{color:#fff;border-color:var(--teal)}
/* COMMITTEE PANEL */
.cpanel{display:none}
.cpanel.active{display:block}
.cp-head{text-align:center;margin-bottom:26px}
.cp-head h2{color:#fff;font-size:1.7em;margin-bottom:4px}
.cp-head .cp-sub{color:var(--teal);font-weight:600;font-size:.85em;letter-spacing:1px;text-transform:uppercase}
.cp-head p{color:#7f9b96;font-size:.92em;max-width:620px;margin:8px auto 0;line-height:1.5}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.member-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px 14px;text-align:center;cursor:pointer;transition:.18s;position:relative}
.member-card:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.avatar{position:relative;width:82px;height:104px;margin:0 auto 12px}
.avatar img{width:82px;height:104px;object-fit:cover;border-radius:10px;border:2px solid var(--teal);display:block;background:#d9e2e0}
.mod-badge{position:absolute;top:-8px;right:-22px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#231302;font-size:.58em;font-weight:800;padding:3px 7px;border-radius:8px;letter-spacing:.3px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.m-name{font-weight:700;color:#fff;font-size:1.02em}
.m-role{color:var(--teal);font-size:.78em;font-weight:600;margin-top:2px;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.m-att{color:var(--gold);font-size:.78em;font-style:italic;margin-top:2px}
.m-open{color:#7f9b96;font-size:.74em;margin-top:10px;font-weight:600}
.member-card:hover .m-open{color:var(--teal)}
/* CV MODAL */
.cv-overlay{display:none;position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.cv-overlay.show{display:flex}
.cv-modal{background:#0d241f;border:1px solid var(--teal);border-radius:18px;width:100%;max-width:760px;max-height:90vh;overflow-y:auto;padding:28px;position:relative;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.cv-x{position:sticky;top:0;float:right;background:transparent;border:1px solid var(--line);color:#9db3af;width:34px;height:34px;border-radius:10px;font-size:1.1em;cursor:pointer}
.cv-x:hover{color:#fff;border-color:var(--teal)}
.cv-head{display:flex;gap:18px;align-items:center;margin-bottom:16px}
.cv-head img{width:96px;height:122px;object-fit:cover;border-radius:10px;border:2px solid var(--teal);background:#d9e2e0}
.cv-name{font-size:1.5em;font-weight:800;color:#fff}
.cv-role{color:var(--teal);font-weight:600}
.cv-att{color:var(--gold);font-size:.85em;font-style:italic;margin-top:3px}
.cv-section{background:#0a1f1b;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.cv-section h4{color:var(--teal);font-size:.8em;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.cv-section div,.cv-section li{color:#d6e0de;font-size:.92em;line-height:1.55}
.cv-section ul{list-style:none}
.cv-section li{padding:3px 0 3px 18px;position:relative}
.cv-section li::before{content:'›';color:var(--teal);position:absolute;left:0;font-weight:700}
.rule{background:rgba(245,158,11,.08);border-left:4px solid var(--gold);padding:12px 16px;border-radius:8px;color:#f3d9a6;font-size:.85em;line-height:1.5;margin-top:14px}
.legend{text-align:center;color:#5c7a74;font-size:.8em;margin-top:18px}
@media(max-width:640px){.hub{grid-template-columns:1fr}.brand h1{font-size:1.4em}}
</style>
</head>

const ORDER = { rv: ["carlos", "helena", "marcos", "fernanda", "rodrigo", "juliana", "andre", "marina", "otavio", "rafael"], rf: ["ricardo", "beatriz", "eduardo", "camila", "patricia", "henrique"] };
const META = {
  rv: {folder:'personas_fotos', title:'Comitê de Renda Variável', acr:'AÇÕES · B3', mod:'rafael',
        desc:'Nove especialistas — fundamentalista, moat, risco, valuation, análise técnica, releases, macro, governança e jurídico — debatem e votam. O Moderador Rafael arbitra e emite o veredito final com faixa de entrada.'},
  rf: {folder:'personas_fotos_rf', title:'Comitê de Renda Fixa', acr:'SELIC · TESOURO DIRETO', mod:'henrique',
        desc:'Cinco especialistas — macro e Selic, inflação, curva e prêmios, fiscal e dívida, e risco — votam entre Prefixado, IPCA+ e Selic. O Moderador Henrique pondera e entrega o veredito.'}
};

function buildHub(){let h='';
  ['rv','rf'].forEach(k=>{
    const m=META[k]; const arr=ORDER[k];
    h+=`<div class="hub-card" onclick="enter('${k}')">
      <div class="count">${arr.length} membros</div>
      <div class="icon">${k==='rv'?'📈':'📊'}</div>
      <span class="acr">${m.acr}</span>
      <h2>${m.title}</h2><p>${m.desc}</p>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="display:flex">${arr.slice(0,8).map(key=>`<img src="${m.folder}/${key}.png">`).join('')}${arr.length>8?`<img style="background:#0d4f3d;color:#bfece7;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.7em">+${arr.length-8}</img>`:''}</div>
        <button class="enter">Entrar no comitê →</button>
      </div>
    </div>`;});
  document.getElementById('hub').innerHTML=h;}

function cardGrid(key){
  const m=META[key]; let g='';
  ORDER[key].forEach(k=>{
    const c=DATA[key][k]; const isMod=(k===m.mod);
    g+=`<div class="member-card" onclick="openCV('${key}','${k}')">
      <div class="avatar"><img src="${m.folder}/${k}.png" alt="${c.nome}">${isMod?'<div class="mod-badge">VEREDITO</div>':''}</div>
      <div class="m-name">${c.gen} ${c.nome}</div>
      <div class="m-role">${c.papel}</div>
      <div class="m-att">${c.atitude}</div>
      <div class="m-open">📄 Ver currículo</div>
    </div>`;});
  const panel=document.getElementById('panel-'+key);
  panel.innerHTML=`<div class="cp-head"><div class="cp-sub">${m.acr}</div><h2>${m.title}</h2><p>${m.desc}</p></div>
    <div class="grid">${g}</div>
    <div class="legend">Clique em um membro para ler o currículo completo.</div>`;
}

function enter(key){document.getElementById('hub').style.display='none';
  ['rv','rf'].forEach(k=>document.getElementById('panel-'+k).classList.remove('active'));
  cardGrid(key);
  document.getElementById('panel-'+key).classList.add('active');
  document.getElementById('backBtn').style.display='inline-block';window.scrollTo(0,0);}
function goHome(){document.getElementById('hub').style.display='grid';
  ['rv','rf'].forEach(k=>document.getElementById('panel-'+k).classList.remove('active'));
  document.getElementById('backBtn').style.display='none';window.scrollTo(0,0);}

function openCV(com,key){const c=DATA[com][key];const m=META[com];
  const sec=(t,body)=>`<div class="cv-section"><h4>${t}</h4>${body}</div>`;
  const lis=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  document.getElementById('cvContent').innerHTML=
    `<div class="cv-head"><img src="${m.folder}/${key}.png" alt="${c.nome}">
      <div><div class="cv-name">${c.gen} ${c.nome}</div>
      <div class="cv-role">${c.papel}</div><div class="cv-att">${c.atitude}</div></div></div>`
    +sec('📌 Resumo',`<div>${c.resumo}</div>`)
    +sec('🎓 Formação',lis(c.formacao))
    +sec('💼 Experiência',lis(c.experiencia))
    +sec('📜 Certificações',lis(c.certificacoes))
    +sec('🌐 Idiomas',`<div>${c.idiomas}</div>`)
    +sec('🎯 Especializações',`<div>${c.especializacoes}</div>`)
    +`<div class="rule">⚖️ Regra de conduta: o agente age conforme o currículo, mas <strong>nunca</strong> usa vieses comportamentais ou achismos — toda conclusão é ancorada em dados e números.</div>`;
  document.getElementById('cvOverlay').classList.add('show');}
function closeCV(){document.getElementById('cvOverlay').classList.remove('show');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCV();});
buildHub();
</script>
</body>
</html>
